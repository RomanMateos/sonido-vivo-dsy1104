<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nuevo producto - Administrador Sonido Vivo">
  <title>Nuevo Producto | Administrador Sonido Vivo</title>
  <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
 
  <a class="salto-contenido" href="#contenido-principal">Ir al contenido</a>
 
  <div class="admin-layout">
    <nav class="admin-menu" aria-label="Menu de administracion">
      <a href="../index.html" class="logo">Sonido Vivo</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html" aria-current="page">Productos</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><a href="../index.html">Volver a la tienda</a></li>
      </ul>
    </nav>
 
    <main id="contenido-principal" class="admin-contenido">
      <h1>Nuevo producto</h1>
 
      <form id="form-producto" class="formulario-registro" novalidate>
        <div class="campo-formulario">
          <label for="codigo">Codigo</label>
          <input type="text" id="codigo" name="codigo" minlength="3" required>
          <span class="mensaje-error" id="error-codigo"></span>
        </div>
 
        <div class="campo-formulario">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" maxlength="100" required>
          <span class="mensaje-error" id="error-nombre"></span>
        </div>
 
        <div class="campo-formulario">
          <label for="descripcion">Descripcion (opcional)</label>
          <textarea id="descripcion" name="descripcion" maxlength="500"></textarea>
        </div>
 
        <div class="campo-formulario">
          <label for="precio">Precio</label>
          <input type="number" id="precio" name="precio" min="0" step="0.01" required>
          <span class="mensaje-error" id="error-precio"></span>
        </div>
 
        <div class="campo-formulario">
          <label for="stock">Stock</label>
          <input type="number" id="stock" name="stock" min="0" step="1" required>
          <span class="mensaje-error" id="error-stock"></span>
        </div>
 
        <div class="campo-formulario">
          <label for="stockCritico">Stock critico (opcional)</label>
          <input type="number" id="stockCritico" name="stockCritico" min="0" step="1">
        </div>
 
        <div class="campo-formulario">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required>
            <option value="">-- Seleccione --</option>
            <option value="Guitarras Acusticas">Guitarras Acusticas</option>
            <option value="Guitarras Electricas">Guitarras Electricas</option>
            <option value="Bajos Electricos">Bajos Electricos</option>
            <option value="Baterias">Baterias</option>
            <option value="Teclados y Pianos">Teclados y Pianos</option>
            <option value="Microfonos">Microfonos</option>
          </select>
          <span class="mensaje-error" id="error-categoria"></span>
        </div>
 
        <div class="campo-formulario">
          <label for="imagen">URL de imagen (opcional)</label>
          <input type="text" id="imagen" name="imagen">
        </div>
 
        <button type="submit" class="boton-submit">Guardar producto</button>
        <p id="mensaje-exito" role="status"></p>
      </form>
    </main>
  </div>
 
  <script src="../assets/js/admin-producto-form.js"></script>
</body>
</html>
