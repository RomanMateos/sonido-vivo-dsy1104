<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mantenedor de productos - Sonido Vivo">
  <title>Productos | Administrador Sonido Vivo</title>
  <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>

  <a class="salto-contenido" href="#contenido-principal">Ir al contenido</a>

  <div class="admin-layout">
    <nav class="admin-menu" aria-label="Menu de administracion">
      <a href="../index.html" class="logo">Sonido Vivo</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html" aria-current="page">Productos</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><a href="../index.html">Volver a la tienda</a></li>
      </ul>
    </nav>

    <main id="contenido-principal" class="admin-contenido">
      <h1>Listado de productos</h1>
      <a href="producto-form.html" class="boton">Nuevo producto</a>

      <table class="tabla-admin">
        <caption>Productos registrados</caption>
        <thead>
          <tr>
            <th scope="col">Codigo</th>
            <th scope="col">Nombre</th>
            <th scope="col">Categoria</th>
            <th scope="col">Precio</th>
            <th scope="col">Stock</th>
            <th scope="col">Accion</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla-productos"></tbody>
      </table>
    </main>
  </div>

  <script src="../assets/js/productos-data.js"></script>
  <script src="../assets/js/admin-productos.js"></script>
</body>
</html>
